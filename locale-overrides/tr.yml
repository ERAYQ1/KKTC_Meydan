            reason: robots.txt dosyanız FriendsOfFlarum Sitemap eklentisi tarafından sağlanır. Arama motorlarına bir robots.txt sunmak için bu eklentiyi kurup etkinleştirin.
            button: robots.txt eklemek hakkında daha fazla bilgi edinin

