      category_label: SEO

    header:
      title: Arama Motoru Optimizasyonu
      tools: Araçlar
      health_check: Sağlık kontrolü
      seo_settings: SEO ayarları
      sitemap_info: Site haritası bilgisi
      search_engines_info: Arama motoru bilgisi
      setup_ssl: SSL kurulumu

    dashboard:
      widget:
        review_prompt: "SEO ayarlarınızı gözden geçirmenin zamanı geldi!"
        cta: Sağlık kontrolünü yap!

    modals:
      crawl_post:
        title: Mesaj tarama ayarları
        intro: <b>Bu iletişim kutusunu dikkatle okuyun.</b> Bu işlev yalnızca bir konu sayfası yenilendiğinde çalışır. Bu seçeneği daha sonra her zaman değiştirebilirsiniz.
        mode_main_title: Sadece ana mesajı indeksle (varsayılan)
        mode_main_help: Arama motoru arama sonuçlarında sadece ana mesajı gösterir. Forum bağlantıları üzerinden konuya gidildiğinde yükleme hızını etkilemez.
        mode_all_title: Bir konudaki tüm mesajları indeksle (ayar etkin)
        mode_all_help: Arama motorları konuları anlar ve arama sonuçlarının altında ilgili bazı mesajları bile gösterebilir. Forumunuzda '<a>en iyi cevap</a>' eklentisi kuruluysa, konuyu arama sonuçlarında 'cevaplandı' olarak işaretler ve kullanıcıyı o mesaja yönlendirir. Her yanıt, beğeni ve oy sayılarıyla birlikte açığa çıkar, böylece arama motorları en iyi cevap eklentisi olmadan bile en yararlı cevapları belirleyebilir. <b>Ancak sunucu ayarlarınıza bağlı olarak bu daha ağır olabilir</b>. Bir miktar performansa mal olabilir, bu yüzden bu özelliği etkinleştirmek sunucunuzun ne kadar hızlı olduğuna bağlıdır.
        question: Bu özelliği etkinleştirmek istiyor musunuz?
        switch_label: "Tüm mesajları tara (sayfa yenilemede daha yavaştır, ancak arama sonuçları daha iyi olur)"

      dofollow:
        title: Do-follow listesi
        intro: Do-follow listesine eklemek istediğiniz alan adlarının <b>host adlarını</b> girin.
        default_note: Flarum kurulumunuz için kullandığınız alan adı varsayılan olarak listeye eklenir.
        learn_more_line: Do-follow listesi hakkında <a>daha fazla bilgi edinin</a>.
        add_placeholder: Bir alan adına izin ver
        duplicate_error: Bu alan adı zaten do-follow listenizde mevcut.

    settings:
      keywords:
        heading: Forum anahtar kelimeleri
        help: Forumunuzu tanımlayan bir veya daha fazla anahtar kelime girin.
        placeholder: Birkaç anahtar kelime ekleyin
        comma_note: "Not: Anahtar kelimeleri virgülle ayırın."
        example: "Örnek: flarum, web geliştirme, forum, elma, güvenlik"

      info:
        overview: Bu sayfa yönetim alanının farklı yerlerinden bazı diğer ayarları içerir. Ancak bu ayarlara genel bir bakışa sahip olmak faydalıdır. SEO kontrolünü yapmayı unutmayın.
        maintain: Bu eklentiyi ilk kurduğunuzda tüm ayarlarınızı kontrol edin. En iyi arama sonuçlarını almak için bunları düzenli tutun.

      twitter_card:
        heading: X (eski adıyla Twitter) kart boyutu
        help: Forumunuz X'te (eski adıyla Twitter) paylaşıldığında bir görsel içerir (bir sosyal medya görseli ayarlanmışsa). Bu, büyük görselli büyük bir kart veya daha küçük görselli küçük bir kart (özet) olabilir.
        option_large: Büyük kart (büyük görsel)
        option_summary: Özet kart (küçük görsel)

      social_media_image:
        heading: Sosyal medya görseli
        help_size: Kare bir görsel bekleniyor. Önerilen boyut 1200x1200 pikseldir. Aksi halde yatay bir görsel kullanın, önerilen boyut 1200x630'dur.
        help_usage: Bu görsel, bir kullanıcı web sitenizdeki bir sayfayı paylaştığında Sosyal Medya tarafından kullanılır (Facebook, X (eski adıyla Twitter), Reddit).

      crawl:
        heading: Konu mesajı tarama ayarları
        help: Bu, konu mesajlarınızın arama sonuçlarında taranmasıyla ilgili önemli bir ayardır.
        button: Mesaj tarama ayarlarını kur

      indexing:
        heading: İndeksleme kontrolleri
        profiles_label: Profil sayfalarını indeksten çıkar
        profiles_help: Etkinleştirildiğinde, kullanıcı profil sayfaları arama sonuçlarında görünmemesi için bir 'noindex' meta etiketi yayar. Sayfadaki bağlantılar yine de takip edilir, böylece tarayıcılar işaret ettikleri içeriğe yine de ulaşabilir.
        tags_help: Seçilen etiketlerdeki konular (ve bu etiketlerin kendi listeleme sayfaları) 'noindex' meta etiketiyle arama sonuçları dışında tutulur. Bağlantılar yine de takip edilir. Bir üst etiketi seçmek alt etiketlerini de kapsar.
        tags_button: Etiket seç
        tags_none_selected: İndekslemeden hariç tutulan etiket yok.

      nofollow:
        heading: No-follow bağlantılar
        help: Harici alan adlarına giden tüm bağlantılar varsayılan olarak bir '<i>nofollow</i>' özniteliği alır. Bu, insanların daha fazla yönlendirme almak için forumunuzu başka alan adlarına bağlantılarla spamlamamasını sağlar.
        help_dofollow: Bu ayarla, alan adlarını 'do-follow' listesine ekleyebilirsiniz. Örneğin, bu web sitesine giden bağlantıların 'nofollow' özniteliği almamasını sağlamak için <i>flarum.org</i>'u ekleyebilirsiniz.
        button: Alan adı do-follow listesini aç

      new_tab:
        heading: Harici bağlantıları yeni sekmede aç
        help: Bu eklenti ayrıca harici bağlantıların (başka alan adlarına) yeni bir sekmede açılmasını sağlar. Şu anda bu ayarı devre dışı bırakmak mümkün değildir.

      updated:
        heading: Bu ayarı güncellediniz mi?
        help: Hazır olduğunuzu düşündüğünüzde, bu ayarın durumunu yeniden kontrol etmek için aşağıdaki düğmeye tıklayın.
        button: Genel bakışa dön ve yeniden kontrol et

    pages:
      search_engines:
        heading: Web sitenizi Arama Motorlarına gönderin
        intro: Arama Motorlarına sitenizin var olduğunu bildirmek iyi bir uygulamadır. Bu sayfa bunu başarıyla yapmanız için size rehberlik edecek.
        sitemap_tip: Bu kılavuzu tamamlamadan önce bir site haritasının hazır olması önerilir. Henüz bir site haritanız yoksa, <a>bunlar hakkında daha fazla bilgi için buraya tıklayın</a>.
        google_heading: Web sitenizi Google arama sonuçlarına ekleyin
        google_visit: Web sitenizi Google arama sonuçlarına eklemek istiyorsanız {link} adresini ziyaret edin. Web sitenizi eklemeniz ve ilişkili alan adının sahibi olduğunuzu doğrulamanız gerekir.
        google_www: "Alan adınızı girdiğinizde şu soruyu kendiniz için yanıtlamanız gerekir: Arama sonuçlarında 'www' alt alan adını kullanmak istiyor musunuz? Bunu daha sonra değiştire<strong>mez</strong>siniz. Alan adınızı Google Search Console'a birden fazla kez kaydetmek daha iyi bir sıralama sağlamaz."
        google_sitemap: Google Search Console'daki kaydı tamamladığınızda, <b>Site Haritaları</b> sayfasını ziyaret edin. <b>sitemap.xml</b> dosyanızı Google'a iletin. Google'ın site haritanızı tarayabildiğinden ve bunu sürdüreceğinden emin olun.
        bing_heading: Web sitenizi Bing arama sonuçlarına ekleyin
        bing_visit: Web sitenizi Bing arama sonuçlarına eklemek istiyorsanız {link} adresini ziyaret edin ve verilen adımları tamamlayın. Tüm alanlar zorunlu değildir.
        bing_sitemap: Site haritası URL'inizi yapılandırmayı unutmayın. Web sitenizi doğruladıktan sonra hazırsınız ve Bing artık web sitenizi indeksleyecektir.
        yandex_heading: Web sitenizi Yandex arama sonuçlarına ekleyin
        yandex_visit: Web sitenizi Yandex arama sonuçlarına eklemek istiyorsanız {link} adresini ziyaret edin ve verilen adımları izleyin.
        yandex_sitemap: Site haritasını Yandex.Webmaster'da yapılandırmayı unutmayın.
        yahoo_heading: Web sitenizi Yahoo arama sonuçlarına ekleyin
        yahoo_body: Web sitenizi Yahoo arama sonuçlarına eklemek istiyorsanız, Bing arama sonuçları kaydınızı tamamlayın. Yahoo bu veriyi kullanacaktır.
        confirm_button: Bunu okudum

      sitemap:
        why_heading: Neden bir site haritası kullanmalısınız?
        why_body: Site haritası, web sitenizdeki tüm mevcut sayfaların listesini içeren bir XML dosyasıdır. Tarayıcılar ve arama motorları tarafından web sitenizdeki sayfaları bulmak için kullanılır.
        generated_note: Site haritası dosyası otomatik olarak oluşturulur ve herhangi bir bakım gerektirmez.
        which_extension_heading: Hangi eklentiyi kurmalıyım?
        which_extension_body: 'Flarum için kurulması önerilen eklenti {link}. Bu eklentiyi kurup etkinleştirmenizi kesinlikle öneririz.'
        which_extension_details: Bu eklenti, tarayıcıların forumunuzdaki <b>konuları</b>, <b>etiketleri</b> (eklenti etkinse) ve <b>Pages</b> eklentisini (kuruluysa ve etkinse) bulmasını sağlar. Otomatik olarak bir sitemap.xml sunar.
        robots_heading: Peki ya robots.txt?
        robots_body: Aynı eklenti forumunuz için bir <b>robots.txt</b> de oluşturur. Bu dosya arama motorlarına hangi alanları tarayabileceklerini söyler ve onları site haritanıza yönlendirir, yani bu eklentiyi kurmak her iki dosyayı da tek seferde halleder — ayrıca yapılandırılacak bir şey yoktur.
        just_installed_heading: Eklentiyi az önce kurdum
        just_installed_body: Bu durumda, sol taraftaki kenar çubuğundaki eklentiye tıklayarak etkinleştirin. Ardından bu uyarı kaybolacaktır.

      ssl:
        intro_heading: Neden güvenli bir bağlantıya ihtiyacım var?
        intro_body: Web'de güvenlik ve gizlilik bilinci artıyor. <b>Neredeyse her</b> geliştirici/web sitesi sahibi, ziyaretçilerinin verilerinin bilgisayar korsanları veya web sitesi taklitçileri tarafından ele geçirilmesinden korkmamaları için web sitelerinin kullanımının güvenli olmasını ister.
        rankings_heading: Arama motorları {icon} güvenli bağlantıları
        rankings_body: Web sitenize güvenli bir bağlantınız yoksa, arama motorları sitenizi diğer sitelere göre çok daha düşük sıralar veya hiç indekslemez.
        rankings_body_ssl: SSL'iniz varsa, web siteniz daha yüksek bir sıralama alır ve indekslenir.
        what_heading: SSL veya TLS nedir?
        what_body: "Çoğu insan güvenli bağlantılar için kullanılan <b>https</b>'i SSL olarak bilir: <i>Secure Sockets Layer</i>. Resmi adı TLS'dir: <i>Transport Layer Security</i>. Bu yöntem, web sunucunuza güvenli bir bağlantı oluşturmak için kullanılır ve saldırganların veya diğer web sunucularının web sitenizi taklit etmesini önler, ziyaretçilerinizi güvende tutar. Bu gerçekleşirse SSL bağlantısı kesilir ve ziyaretçilerin tarayıcıları kullanıcıyı güvenilir olmadığı konusunda uyarır."
        how_heading: Web siteme nasıl SSL eklerim?
        how_body: Web barındırma kullanan kişiler için en yaygın yol, barındırma paneline girmek, web sitenizin barındırma ayarlarına gitmek ve SSL'e tıklamaktır. Web sitenize SSL eklemek için adımları izleyebilirsiniz. Günümüzde çoğu web barındırma şirketi popüler sertifika sağlayıcısı {link}'i desteklemektedir.
        added_heading: Tamam, SSL ekledim!
        added_body: Harika! Şimdi <b>config.php</b> dosyanızı değiştirin ve <b>'url'</b>'yi <b>https</b> yapın!
        no_ssl_heading: SSL eklemek istemiyorsam ne olur?
        no_ssl_body: Bu durumda, bu eklentiyi kaldırabilirsiniz çünkü arama motorları güvenlik nedeniyle <b>forumunuzu indekslemeyecek</b> veya diğer sitelerin çok altında sıralayacaktır.

