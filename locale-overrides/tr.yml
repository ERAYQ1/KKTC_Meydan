        heading: Soft 404 önleme
        help: Bir modelin çok az veya hiç ilgili içeriği yoksa, Google ve diğer tarayıcılar bunları "soft 404" sayfa olarak işaretleyebilir. Bunu önlemek için, her uygun öğe türü için gereken minimum öğe sayısını buradan ayarlayın.
