# KKTC Meydan — üçüncü parti (fof/*, ianm/*) eklentiler için Türkçe çeviri
# tamamlayıcısı. Bu paketler kendi içlerinde sadece en.yml ile geliyor;
# Flarum birden fazla Locales dizinini aynı locale için birleştirdiğinden
# (bkz. extend.php -> Extend\Locales), bu dosyadaki anahtarlar paketin
# kendi çevirisi gibi devreye girer. Kapsanmayan nadir/teknik anahtarlar
# İngilizce olarak kalır (Flarum eksik anahtarda otomatik fallback yapar).

fof-best-answer:
  admin:
    permissions:
      best_answer: En İyi Cevabı Seç (kendi konusunda)
      best_answer_not_own_discussion: En İyi Cevabı Seç (başkasının konusunda)
      allow_select_own_post: Kendi mesajını en iyi cevap olarak seçebilir
    settings:
      label:
        tags: En İyi Cevap Etiketleri
        general: Genel
        reminders: Hatırlatmalar
        search: Arama
        advanced: Gelişmiş
        reminders_notice: Hatırlatmaların çalışması için Flarum zamanlayıcısının doğru kurulmuş olması gerekir.
      show_max_lines_label: Mesaj önizlemesinde gösterilecek maksimum satır
      show_max_lines_help: Kapatmak için 0 girin. Mesaj bu satır sayısından uzunsa önizlemede solma efektiyle kısaltılır.
      select_best_answer_reminder_days: Hatırlatma sıklığı
      select_best_answer_reminder_days_help: Konu sahibine en iyi cevabı seçmesi için yapılandırılabilir gün sayısı sonra hatırlatma gönder, 0 = hatırlatmaları kapat.
      select_best_answer_tags_label: En iyi cevaplı konular için etiketler
      select_best_answer_tags_help: En iyi cevap seçildiğinde konuya hangi etiketlerin ekleneceğini seçin. Sadece ikincil etiketlere izin verilir. En iyi cevap kaldırılırsa bu etiketler de kaldırılır.
      schedule_on_one_server: Zamanlayıcı görevi için 'onOneServer()' yönergesini kullan
      schedule_on_one_server_help: Redis/Memcache gerektirir
      schedule_stop_overnight: Gece saatlerinde hatırlatma bildirimi gönderilmesini engelle
      schedule_stop_overnight_help: Sunucu saatiyle 21:00 - 08:00 arası
      schedule_log_output: Zamanlayıcı çıktısını log dosyasına ekle
      show_filter_label: En iyi cevap filtre menüsünü göster
      show_filter_help: En iyi cevap özelliği açık etiketler için, konu listesinde çözüldü/çözülmedi filtre seçeneğini göster
      use_alt_ui: Alternatif görünüm
      use_alt_ui_help: Mesaj altlığında en iyi cevap kontrolleri
      documentation: Dokümantasyon
      enabled_tags_label: Etkin Etiketler
      enabled_tags_help: En iyi cevap özelliğinin hangi etiketlerde etkin olacağını seçin. Bu etiketler "Soru-Cevap" biçimli etiketlere dönüşür ve en iyi cevap belirlenebilir hale gelir.
      remind_tags_label: Hatırlatma Etiketleri
      remind_tags_help: Hangi etiketler için hatırlatma gönderileceğini seçin. Hatırlatmalar sadece bu etiketli konular için gönderilir.
      tags_info: |
        Bir etikette en iyi cevap özelliği açıldığında, hangi kullanıcı gruplarının cevap belirleyebileceğini (kendi konusu, herhangi bir konu) ayarlayın. İzinler genel olarak (en iyi cevap açık her etiket için) veya etiket bazında verilebilir.
      solution_search: Çözüm arama
      solution_search_help: En iyi cevaplı konularda arama yapabilme özelliğini etkinleştir
      remove_solutions_from_main_search: Çözümleri genel aramadan çıkar
      remove_solutions_from_main_search_help: En iyi cevaplı konuları genel "tüm konular" arama sonuçlarından çıkar
      display_tags: Arama sonuçlarında etiketleri göster
      display_tags_help: En iyi cevaplı konuların arama sonuçlarında etiket(ler)ini göster
      discussion_sidebar_jump_button: Konu kenar çubuğunda en iyi cevaba git düğmesini göster
      discussion_sidebar_jump_button_help: Konu kenar çubuğuna, mesaj akışında en iyi cevaba atlayan bir düğme ekler.
    edit_tag:
      qna_label: Bu etikette en iyi cevap belirlenebilsin
      reminders: Bu etiketteki konularda en iyi cevap belirlemek için hatırlatma gönder
  forum:
    answered_badge: Cevaplandı
    this_best_answer: En İyi Cevabı Seç
    remove_best_answer: En İyi Cevap Seçimini Kaldır
