            reason_missing: Henüz bir forum açıklaması ayarlamadınız!
            reason_default: Kurulumdan sonra varsayılan forum açıklamasını değiştirmediniz!
            reason_too_short: Forum açıklamanız 20 karakterden kısa. Daha iyi arama sonuçları için lütfen genişletin.
            button: Açıklamayı güncelle

          keywords:
            label: Forumunuzda anahtar kelime ayarlanıp ayarlanmadığını kontrol eder
            reason: Henüz forum anahtar kelimeleri ayarlamadınız!
            button: Anahtar kelimeleri güncelle

          ssl:
            label: Sitenizin güvenli bir bağlantısı (SSL/TLS) olup olmadığını kontrol eder
            reason: Forumunuz SSL/TLS bağlantısını (web sitenize güvenli bir bağlantı) zorunlu kılmıyor. Çoğu arama motoru güvenli bağlantınız yoksa web sitenizi indekslemez veya sıralamanızı düşürür.
            button: SSL nasıl kurulur

          crawl:
            label: Konu mesajı tarama ayarlarını gözden geçir
            reason: Geçmek için bu ayarı gözden geçirmeniz gerekecek.
            button: Mesaj ayarlarını gözden geçir

          social_media:
            label: Bir sosyal medya görseli ayarlayın
            reason: Forumunuz için bir sosyal medya görseli ayarlamadınız. Bir tane ayarlamanız önerilir. Favicon'unuz şimdilik sosyal medyada önizleme olarak kullanılacak.
            button: Görseli güncelle

