      mode_help_runtime: Konu, kullanıcı, etiket ve sayfa sayısı toplamda 10.000'in altında olan, genellikle paylaşımlı barındırma ortamındaki küçük forumlar için. Site haritası her istekte anlık olarak oluşturulur.
