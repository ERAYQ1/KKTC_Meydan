      column_pruning_help: "SELECT * yerine sadece URL oluşturmak için gereken sütunları çeker (ör. id, slug, kullanıcı adı, tarihler). Büyük forumlarda model başına bellek kullanımını önemli ölçüde azaltır. Varsayılan olarak etkindir — sadece özel bir slug sürücüsü veya görünürlük kapsamı varsayılan seçimde olmayan sütunlar gerektiriyorsa kapatın."
