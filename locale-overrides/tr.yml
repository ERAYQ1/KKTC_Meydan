      awarded: Mesajınız {username} tarafından en iyi cevap olarak seçildi
      preferences:
        awarded_best_answer: Biri mesajımı en iyi cevap olarak seçtiğinde
        best_answer_in_discussion: Katıldığım bir konuda en iyi cevap belirlendiğinde
        select_best_answer: Başlattığım bir konuda en iyi cevap seçmem için otomatik hatırlatma
    index:
      ask_question: Soru Sor
      cannot_ask_question: Soru Soramazsınız
      solved_link: Çözülen konular
      unsolved_link: Çözülmeyen konular
    filter:
      all_label: Tüm sorular
      solved_label: Çözülen sorular
      unsolved_label: Çözülmeyen sorular
      accessible_label: Çözüldü/çözülmedi seçimi
    composer:
      titlePlaceholder: Soru başlığı
    user:
      best-answer-count: "{count, plural, one {{count} en iyi cevap} other {{count} en iyi cevap}}"
    search:
      discussions_solutions_heading: "Çözümü olan konular"
      all_discussions_solutions_button: "\"{query}\" için çözümü olan tüm konularda ara"
    discussion:
      jump_to_best_answer_button: En İyi Cevabı Görüntüle
  email:
    subject:
      awarded: Mesajınız {display_name} tarafından en iyi cevap olarak seçildi
      ba-set: "{display_name} bir en iyi cevap belirledi"
      select: Sorunuza cevap bulabildiniz mi?
    body:
      awarded: |
        Merhaba {recipient_display_name},

        Tebrikler, {actor_display_name} mesajınızı şu konuda en iyi cevap olarak seçti: {discussion_title}. Yardımcı olduğunuz için teşekkürler.

        Buradan görüntüleyin: {discussion_url}
      ba-set: |
        Merhaba {recipient_display_name},

        {actor_display_name} katıldığınız şu konuda bir en iyi cevap belirledi: {discussion_title}.

        Göz atın: {discussion_url}
      select: |
        Merhaba {recipient_display_name},

        Kontrol etmek istedik; şu ana kadar sorunuza dair epey cevap almış olmalısınız: {discussion_title}. Umarız içlerinden biri sorununuzu çözmüştür.

        Öyleyse, sorunuza bir en iyi cevap belirlemeniz gelecekteki üyeler için gerçekten faydalı olur. Aynı sorunu yaşayanların ihtiyaç duydukları cevabı bulmasına yardımcı olur, ayrıca size yardım eden üyelere de bir teşekkür niteliği taşır. Zamanlarını gönüllü olarak ayırdılar, iyi iş çıkardıklarını bilmelerini sağlamak güzel olur.

        Konuyu buradan ziyaret edin: {discussion_url} ve en uygun mesajı en iyi cevap olarak seçin.

        Teşekkürler!

