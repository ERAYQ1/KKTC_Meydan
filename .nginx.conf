# KKTC Meydan Platformu — nginx yapılandırması
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    server_tokens off;
    client_max_body_size 25M;

    index index.php index.html index.htm;
    charset utf-8;

    # Security headers. `always` so these are also sent on error responses
    # (4xx/5xx) - without it nginx's add_header only fires on 2xx/3xx.
    #
    # NOT inherited into location blocks that define their own add_header
    # (nginx quirk: a child add_header list replaces the parent's, it
    # doesn't merge) - repeated in the static-asset location below for that
    # reason.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # fof/formatting embeds YouTube iframes; unsafe-inline on style is
    # required by Mithril (Flarum's frontend framework), which sets inline
    # style attributes at runtime. unsafe-inline on script is required by
    # Flarum's own boot HTML, which embeds an inline <script> that reads the
    # JSON payload and calls app.boot() - without it the app never boots
    # (blank page, confirmed: script-src 'self' alone breaks every page).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to KKTC Meydan Platformu FastCGI server (flarum-app:9000)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass flarum-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files and storage
    location ~ /\. {
        deny all;
    }

    # Source maps point straight at unminified source (Mithril/JS module
    # names, code structure) - useful in dev, an info leak in prod.
    location ~* \.map$ {
        deny all;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|eot|ttf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
